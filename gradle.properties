org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# minSdk 29: matches the per-app Vulkan driver loader requirement (Android 10+)
# documented by the panvk-on-kbase ecosystem and keeps the ICD-injection path uniform.

# Constrained-sandbox build flags (also fine on dev machines)
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
