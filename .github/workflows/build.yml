name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK preinstalled (ANDROID_HOME set, licenses
      # accepted); AGP auto-installs any missing NDK/cmake, so no setup-android needed.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hailon2V1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      # Releases are cut from locally built, verified APKs (a tag-triggered job would
      # otherwise attach a second copy under a different name); CI builds stay as artifacts.
