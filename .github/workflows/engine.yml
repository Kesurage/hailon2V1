name: engine

# The real app: hakuX's engine core (native/, cross-compiled with the NDK)
# plus its Android app, as patched by this fork. The core is built first
# (tools/native/app-libs.sh packs it into the app), then the APKs.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "launcher/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build tools (ninja)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Android SDK components (platform 36, build-tools 36.1.0, NDK 29)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "android-36|36.1.0|29.0.14206865" || true

      - name: Fetch the core's third-party sources (NC_DEPS)
        run: bash tools/ci/fetch-nc-deps.sh "$HOME/nc-deps"

      - name: Build the native core (libhakuxcore.so)
        run: |
          # CMAKE_CXX_SCAN_FOR_MODULES=OFF: CMake 3.30+ scans sources for
          # C++20 modules and synthesizes std-module targets against the
          # HOST's libstdc++ (GCC 15) — which the NDK cross-compile cannot
          # compile ('stdbit.h' not found). Nothing here uses C++ modules.
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULE_STD=OFF \
            -DNC_DEPS="$HOME/nc-deps"
          ninja -C build/native/core hakuxcore

      - name: Pack the core's libraries into the app
        run: ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION" bash tools/native/app-libs.sh build/native/core

      - name: Build the APKs
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect artifacts
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "hailon2V1-$V-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "hailon2V1-$V-release.apk"
          ls -la hailon2V1-*.apk
          # The APK must carry the engine core (a packing failure here is a broken build).
          unzip -l "hailon2V1-$V-debug.apk" | grep -m1 "libhakuxcore.so" || { echo "CORE LIB MISSING FROM APK"; exit 1; }
          unzip -l "hailon2V1-$V-debug.apk" | grep -m1 "libSDL3.so" || { echo "SDL3 MISSING FROM APK"; exit 1; }

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hailon2V1-apks
          path: hailon2V1-*.apk
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          V="${{ env.VERSION }}"
          cat > release-notes.md <<EOF
          hailon2V1 ${{ env.VERSION }} — the launcher release: FSR 1.0, better touch sticks, a cleaner HUD

          Over 1.3.1 (which already carried hakuX master's Mali-G57 fixes: the
          swapchain image-array cap that flickered, vb_align, no_wbuf, the
          timeline semaphore wait):

          - AMD FidelityFX Super Resolution 1.0 (EASU + RCAS) as an upscaling
            filter in Settings → Graphics: on the Helio G100's Mali-G57 MC2,
            1x resolution + FSR is the speed preset (the frame is rebuilt at
            the panel's size instead of blurring into it); it replaces FXAA
            while on (RCAS sharpens). From AMD's FidelityFX-FSR, MIT.
          - Touch sticks: the dead zone no longer jumps (a smooth ramp from
            its edge to full tilt), and full deflection is reached a little
            inside the rim, where a thumb actually lands.
          - The in-game HUD is the FPS counter only; the debug hitch monitor
            is off by default (still in the settings).
          - Settings: an About section (version, license); the upscaler list
            names all three filters. Full-screen with the notch in use was
            already hakuX's (shortEdges + fullscreen theme).
          - Custom Vulkan drivers (a panvk build for the G57 among them) load
            through Settings → GPU driver on phones with /dev/mali0 — the
            stock driver stays the default.

          hailon2V1-$V-debug.apk installs beside the stock hakuX (its id ends
          in .debug) and updates over 1.3.1. hailon2V1-$V-release.apk is the
          plain release build.
          GPL-3.0+ — source in this repository.
          EOF
          {
            gh release create "$TAG" --title "hailon2V1 ${{ env.VERSION }}" \
              --notes-file release-notes.md \
              "hailon2V1-${{ env.VERSION }}-debug.apk" "hailon2V1-${{ env.VERSION }}-release.apk" ||
            gh release upload "$TAG" "hailon2V1-${{ env.VERSION }}-debug.apk" "hailon2V1-${{ env.VERSION }}-release.apk" --clobber
          }
