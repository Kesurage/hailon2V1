name: engine

# The real app: hakuX's engine core (native/, cross-compiled with the NDK)
# plus its Android app, as patched by this fork. The core is built first
# (tools/native/app-libs.sh packs it into the app), then the APKs.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore:
      - "launcher/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      NDK_VERSION: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build tools (ninja)
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Android SDK components (platform 36, build-tools 36.1.0, NDK 29)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | grep -E "android-36|36.1.0|29.0.14206865" || true

      - name: Fetch the core's third-party sources (NC_DEPS)
        run: bash tools/ci/fetch-nc-deps.sh "$HOME/nc-deps"

      - name: Build the native core (libhakuxcore.so)
        run: |
          # CMAKE_CXX_SCAN_FOR_MODULES=OFF: CMake 3.30+ scans sources for
          # C++20 modules and synthesizes std-module targets against the
          # HOST's libstdc++ (GCC 15) — which the NDK cross-compile cannot
          # compile ('stdbit.h' not found). Nothing here uses C++ modules.
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
            -DCMAKE_CXX_MODULE_STD=OFF \
            -DNC_DEPS="$HOME/nc-deps"
          ninja -C build/native/core hakuxcore

      - name: Pack the core's libraries into the app
        run: ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION" bash tools/native/app-libs.sh build/native/core

      - name: Build the APKs
        run: |
          cd android
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Collect artifacts
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk "hailon2V1-$V-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "hailon2V1-$V-release.apk"
          ls -la hailon2V1-*.apk
          # The APK must carry the engine core (a packing failure here is a broken build).
          unzip -l "hailon2V1-$V-debug.apk" | grep -m1 "libhakuxcore.so" || { echo "CORE LIB MISSING FROM APK"; exit 1; }
          unzip -l "hailon2V1-$V-debug.apk" | grep -m1 "libSDL3.so" || { echo "SDL3 MISSING FROM APK"; exit 1; }

      - name: Upload APKs (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hailon2V1-apks
          path: hailon2V1-*.apk
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          V="${{ env.VERSION }}"
          cat > release-notes.md <<EOF
          hailon2V1 0002E — the framegen flicker, the PanVK stutter, the aim, the mods

          - Frame generation no longer flickers: it blended after any
            refresh the game left empty, so a game grazing the screen's
            rate (55-59 fps on 60 Hz) showed a ghosted double-exposure on
            and off, each ghost delaying its frame a refresh. It now
            blends only while the game runs solidly behind the display
            (half rate and lower); at or near the panel's rate it never
            blends, exactly as if it were off.
          - No more stutter on PanVK: the presenter waited on the CPU for
            its passes (a wait only Qualcomm's own driver needs — Turnip
            and PanVK hand the compositor a sync file and return at once).
            On the Helio G100's Mali-G57 the window's thread sat behind
            the game's GPU work and missed refresh after refresh: hiccups,
            whole frames late. PanVK is exempt from the wait now, as
            Turnip always was. Which driver you run: Settings → Graphics →
            GPU driver — the entry marked "in use" is the one running.
          - The aim tracks the thumb: Halo 2 turns roughly cubic in the
            stick's deflection, so a medium drag sat where the game barely
            turns. The look's response bends by the cube root now — the
            bend and the game's curve cancel, the camera turning in
            proportion to how fast the thumb moves. Default sensitivity
            1.6x, full tilt at a drag of ~800 dp/s held, and a 1.25x
            vertical gain (the game turns slower up and down). The slider
            stays in Settings.
          - Mods hold, or don't apply at all: a mod of another release of
            the game used to apply whichever of its lines happened to
            match — a half-patched game, glitches of its own. It is left
            off whole now, with one line in the log saying so; and mods
            are found for a disc whose certificate version differs from
            the folder's (Halo 2's pressings differ in it), each patch
            still checked byte for byte.
          - Modded maps load: Halo 2 caches its maps on the console's
            cache drives (X:, Y:, Z:) and keeps loading them from the
            cache, not the disc — a modded map showed only once that cache
            was cleared. The cache drives are cleared whenever the files
            the mods put over the disc change between runs. Savestates
            carry their own cache and are safe.

          hailon2V1-$V-debug.apk installs beside the stock hakuX (its id
          ends in .debug) and updates over 0002D. hailon2V1-$V-release.apk
          is the plain release build.
          GPL-3.0+ — source in this repository.
          EOF
          {
            gh release create "$TAG" --title "hailon2V1 ${{ env.VERSION }}" \
              --notes-file release-notes.md \
              "hailon2V1-${{ env.VERSION }}-debug.apk" "hailon2V1-${{ env.VERSION }}-release.apk" ||
            gh release upload "$TAG" "hailon2V1-${{ env.VERSION }}-debug.apk" "hailon2V1-${{ env.VERSION }}-release.apk" --clobber
          }
